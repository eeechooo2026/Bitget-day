name: Bitget 第110个工作流 - 4小时级别跌幅榜扫描（每4小时整点）

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Run 110th workflow scan
        run: python scanner_110th_workflow.py
