name: Bitget 第90个工作流 - 4小时级别KDJ多头排列扫描（手动触发）

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Run 90th workflow scan
        run: python scanner_90th_workflow.py
