name: Bitget 第113个工作流 - 1小时级别涨幅×杠杆评分榜扫描（每小时整点）

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Run 113th workflow scan
        run: python scanner_113th_workflow.py
