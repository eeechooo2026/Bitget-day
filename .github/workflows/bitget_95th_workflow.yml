name: Bitget 第95个工作流 - 1小时级别KDJ空头+震荡+收阴扫描（手动触发）

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Run 95th workflow scan
        run: python scanner_95th_workflow.py
