name: Bitget 第103个工作流 - 1小时级别空头振幅榜 + 收盘<MA5（每小时整点）

on:
  schedule:
    # 每小时整点运行（UTC时间）
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Run 103rd workflow scan
        run: python scanner_103rd_workflow.py
