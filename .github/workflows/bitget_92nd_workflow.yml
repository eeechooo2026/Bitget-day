name: Bitget 第92个工作流 - 1小时级别KDJ多头+J值上升+前低扫描（手动触发）

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Run 92nd workflow scan
        run: python scanner_92nd_workflow.py
